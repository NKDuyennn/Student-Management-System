<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <img src="logo-placeholder.png" alt="School Logo">
      </div>
      <ul class="menu">
        <li class="active">
          <span>🏠</span> Home
        </li>
        <li>
          <span>📅</span> Schedule
        </li>
        <li>
          <span>🏫</span> Class
        </li>
        <li>
          <span>👩‍🏫</span> Teacher
        </li>
        <li>
          <span>🧑‍🎓</span> Student
        </li>
      </ul>
      <div class="settings">
        ⚙️ Settings
      </div>
    </aside>

    <!-- Main content -->
    <main>
      <header class="header">
        <h1>STUDENT MANAGEMENT SYSTEM</h1>
        <div class="user-info">
          <div class="user-name">
            <span>KOME CHAN</span>
            <small>Admin</small>
          </div>
          <button class="logout-btn">Log out</button>
        </div>
      </header>

      <!-- School Info Section -->
      <section class="school-info">
        <h2>School Infor</h2>
        <div class="info-cards">
          <div class="info-card">
            <p class="info-value">2,000</p>
            <p class="info-label">Students</p>
          </div>
          <div class="info-card">
            <p class="info-value">200</p>
            <p class="info-label">Teachers</p>
          </div>
          <div class="info-card">
            <p class="info-value">100</p>
            <p class="info-label">Classes</p>
          </div>
        </div>
      </section>

      <!-- Actions Section -->
      <section class="actions">
        <div class="action-card">
          <span>📈</span>
          Create New Class
        </div>
        <div class="action-card">
          <span>🖥️</span>
          Update & Delete Classes
        </div>
        <div class="action-card">
          <span>👩‍🏫</span>
          Update & Delete Teachers
        </div>
        <div class="action-card">
          <span>🧑‍🎓</span>
          Update & Delete Students
        </div>
      </section>
    </main>
  </div>
</body>
</html>
